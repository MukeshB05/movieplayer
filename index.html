<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.youtube.com https://s.ytimg.com; frame-src https://www.youtube.com; style-src 'unsafe-inline';">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Movie Player</title>

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
    }

    .player-container {
      width: 100%;
      max-width: 1280px;
    }

    .player-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      background: #000;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,.75);
    }

    #player {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    #player iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }

    .loading {
      position: absolute;
      inset: 0;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: #000;
      color: #fff;
      text-align: center;
      padding: 20px;
    }

    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(255,255,255,.15);
      border-top-color: #e50914;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .error-message {
      max-width: 600px;
      padding: 22px;
      border: 1px solid rgba(255,80,80,.35);
      border-radius: 14px;
      background: rgba(255,0,0,.08);
      line-height: 1.5;
    }

    .error-message strong {
      display: block;
      font-size: 18px;
      margin-bottom: 8px;
    }

    .error-message small {
      display: block;
      margin-top: 10px;
      opacity: .7;
      word-break: break-word;
    }

    .player-info {
      position: absolute;
      z-index: 10;
      left: 22px;
      right: 22px;
      bottom: 72px;
      pointer-events: none;
      text-shadow: 0 2px 14px #000;
    }

    .player-info h1 {
      margin: 0 0 6px;
      font-size: 25px;
      font-weight: 700;
    }

    .meta {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      font-size: 14px;
    }

    .badge {
      display: inline-block;
      padding: 4px 9px;
      border-radius: 999px;
      background: #e50914;
      font-size: 11px;
      font-weight: 700;
    }

    .retry-btn {
      margin-top: 15px;
      padding: 10px 24px;
      background: #e50914;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      pointer-events: auto;
      transition: background 0.3s;
    }

    .retry-btn:hover {
      background: #f40612;
    }

    @media (max-width: 600px) {
      body { padding: 0; }

      .player-wrapper {
        border-radius: 0;
        min-height: 56.25vw;
      }

      .player-info {
        left: 14px;
        right: 14px;
        bottom: 62px;
      }

      .player-info h1 { font-size: 18px; }
      .meta { font-size: 12px; }
    }
  </style>
</head>

<body>
  <main class="player-container">
    <section class="player-wrapper" id="playerWrapper">

      <div class="loading" id="loading">
        <div class="spinner"></div>
        <div id="loadingText">Loading movie...</div>
      </div>

      <div id="player"></div>

      <div class="player-info" id="playerInfo" hidden>
        <h1 id="movieTitle"></h1>
        <div class="meta">
          <span id="movieYear"></span>
          <span class="badge" id="movieQuality"></span>
        </div>
      </div>

    </section>
  </main>

  <script>
    "use strict";

    // MOVIE DATABASE
    const MOVIES = {
      "tt0111161": {
        youtube_id: "6hB3S9bIaco",
        title: "The Shawshank Redemption",
        year: "1994",
        quality: "4K HDR"
      },
      "tt0068646": {
        youtube_id: "sY1S34973zA",
        title: "The Godfather",
        year: "1972",
        quality: "4K"
      },
      "351421": {
        youtube_id: "s6P9QNj2_o0",
        title: "The Dark Knight",
        year: "2008",
        quality: "4K IMAX"
      },
      "350787": {
        youtube_id: "3IqGqL-FyQk",
        title: "Pandippada",
        year: "2005",
        quality: "HD"
      }
    };

    // DOM Elements
    const loadingEl = document.getElementById("loading");
    const playerEl = document.getElementById("player");
    const playerInfoEl = document.getElementById("playerInfo");
    const movieTitleEl = document.getElementById("movieTitle");
    const movieYearEl = document.getElementById("movieYear");
    const movieQualityEl = document.getElementById("movieQuality");
    const loadingTextEl = document.getElementById("loadingText");

    let youtubePlayer = null;
    let apiReady = false;
    let playerReady = false;
    let retryCount = 0;
    const MAX_RETRIES = 3;

    // Utility Functions
    function cleanId(value) {
      if (!value) return "";
      try {
        return decodeURIComponent(String(value))
          .trim()
          .replace(/^\/+|\/+$/g, "");
      } catch (error) {
        return String(value)
          .trim()
          .replace(/^\/+|\/+$/g, "");
      }
    }

    function getMovieId() {
      const url = new URL(window.location.href);

      const queryId =
        url.searchParams.get("id") ||
        url.searchParams.get("tmdb") ||
        url.searchParams.get("movie");

      if (queryId) {
        return cleanId(queryId);
      }

      const parts = url.pathname
        .split("/")
        .map(cleanId)
        .filter(Boolean);

      if (!parts.length) return "";

      const movieIndex = parts.findIndex(
        part => part.toLowerCase() === "movie"
      );

      if (movieIndex !== -1 && parts[movieIndex + 1]) {
        return parts[movieIndex + 1];
      }

      return parts[parts.length - 1];
    }

    function isValidYouTubeId(id) {
      return typeof id === "string" && /^[A-Za-z0-9_-]{11}$/.test(id);
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function showError(title, message, showRetry = true) {
      loadingEl.innerHTML = `
        <div class="error-message">
          <strong>${escapeHtml(title)}</strong>
          <div>${escapeHtml(message)}</div>
          <small>
            Movie ID: ${escapeHtml(getMovieId() || "not specified")}
          </small>
          ${showRetry ? `<button class="retry-btn" onclick="retryLoad()">Retry</button>` : ''}
        </div>
      `;
      loadingEl.hidden = false;
      playerInfoEl.hidden = true;
    }

    function showMovieInfo(movie) {
      movieTitleEl.textContent = movie.title || "";
      movieYearEl.textContent = movie.year || "";
      movieQualityEl.textContent = movie.quality || "HD";
      playerInfoEl.hidden = false;
    }

    function getPlayerErrorMessage(code) {
      switch (code) {
        case 2: return "Invalid YouTube video ID.";
        case 5: return "The YouTube HTML5 player could not play this video.";
        case 100: return "This YouTube video does not exist or has been removed.";
        case 101:
        case 150: return "This video does not allow playback in an embedded player.";
        default: return "YouTube could not load this video.";
      }
    }

    // YouTube Player Functions
    function createYouTubePlayer(movie) {
      if (playerReady) return;

      if (typeof YT === "undefined" || typeof YT.Player === "undefined") {
        loadingTextEl.textContent = "Loading YouTube player...";
        loadYouTubeAPI();
        return;
      }

      try {
        playerReady = true;
        loadingTextEl.textContent = "Initializing player...";

        playerEl.innerHTML = "";

        youtubePlayer = new YT.Player("player", {
          width: "100%",
          height: "100%",
          videoId: movie.youtube_id,
          playerVars: {
            autoplay: 1,
            controls: 1,
            rel: 0,
            playsinline: 1,
            modestbranding: 1,
            iv_load_policy: 3,
            enablejsapi: 1,
            origin: window.location.origin
          },
          events: {
            onReady: function(event) {
              console.log("YouTube player ready:", movie.title);
              loadingEl.hidden = true;
            },
            onStateChange: function(event) {
              console.log("YouTube state:", event.data);
              if (event.data === YT.PlayerState.PLAYING) {
                loadingEl.hidden = true;
              }
            },
            onError: function(event) {
              console.error("YouTube error:", event.data);
              playerReady = false;
              showError(
                "Playback error",
                getPlayerErrorMessage(event.data)
              );
            }
          }
        });
      } catch (error) {
        console.error("Error creating YouTube player:", error);
        playerReady = false;
        showError(
          "Player creation error",
          "Failed to create YouTube player. Please try again."
        );
      }
    }

    function loadYouTubeAPI() {
      if (document.querySelector('script[src*="youtube.com/iframe_api"]')) {
        return;
      }

      loadingTextEl.textContent = "Loading YouTube player...";
      
      const script = document.createElement("script");
      script.src = "https://www.youtube.com/iframe_api";
      script.async = true;
      script.onerror = function() {
        console.error("Failed to load YouTube API");
        if (retryCount < MAX_RETRIES) {
          retryCount++;
          loadingTextEl.textContent = `Retrying... (${retryCount}/${MAX_RETRIES})`;
          setTimeout(loadYouTubeAPI, 2000);
        } else {
          showError(
            "YouTube API Error",
            "Failed to load YouTube player. Please check your internet connection.",
            true
          );
        }
      };
      document.head.appendChild(script);
    }

    // Main Initialization
    function initMovie() {
      const movieId = getMovieId();
      console.log("Movie ID:", movieId);

      if (!movieId) {
        showError(
          "Movie ID missing",
          "Open this page with ?id=350787 or /movie/350787.",
          false
        );
        return;
      }

      const movie = MOVIES[movieId];
      if (!movie) {
        showError(
          "Movie not found",
          `No movie is configured for ID: ${movieId}`,
          false
        );
        return;
      }

      if (!isValidYouTubeId(movie.youtube_id)) {
        showError(
          "Invalid YouTube ID",
          "The configured YouTube video ID must contain exactly 11 characters.",
          false
        );
        return;
      }

      showMovieInfo(movie);

      if (typeof YT !== "undefined" && typeof YT.Player !== "undefined") {
        apiReady = true;
        createYouTubePlayer(movie);
      } else {
        loadingTextEl.textContent = "Loading YouTube player...";
        loadYouTubeAPI();
      }
    }

    // Retry Function
    window.retryLoad = function() {
      retryCount = 0;
      playerReady = false;
      apiReady = false;
      loadingEl.innerHTML = `
        <div class="spinner"></div>
        <div id="loadingText">Retrying...</div>
      `;
      loadingEl.hidden = false;
      // Re-initialize
      setTimeout(initMovie, 500);
    };

    // YouTube API Callback
    window.onYouTubeIframeAPIReady = function() {
      console.log("YouTube IFrame API loaded");
      apiReady = true;
      retryCount = 0;
      initMovie();
    };

    // Fallback if API doesn't load
    window.onYouTubeIframeAPIError = function() {
      console.error("YouTube IFrame API failed to load");
      if (retryCount < MAX_RETRIES) {
        retryCount++;
        loadingTextEl.textContent = `Retrying... (${retryCount}/${MAX_RETRIES})`;
        setTimeout(loadYouTubeAPI, 2000);
      } else {
        showError(
          "YouTube API Error",
          "Failed to load YouTube player. Please refresh the page.",
          true
        );
      }
    };

    // Initialize on DOM ready
    document.addEventListener("DOMContentLoaded", function() {
      if (typeof YT !== "undefined" && typeof YT.Player !== "undefined") {
        apiReady = true;
      }
      initMovie();
    });

    // Timeout fallback
    setTimeout(function() {
      if (loadingEl.hidden === false && !playerReady) {
        if (retryCount >= MAX_RETRIES) {
          showError(
            "Loading timeout",
            "The player took too long to load. Please try again.",
            true
          );
        }
      }
    }, 15000);
  </script>
</body>
</html>
