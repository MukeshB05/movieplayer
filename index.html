<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Movie Player</title>
    <!-- Plyr CSS -->
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0b0b0b;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            padding: 16px;
        }

        .player-container {
            width: 100%;
            max-width: 1280px;
            margin: 0 auto;
        }

        .player-wrapper {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            background: #0a0a0a;
            border-radius: 20px;
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.9);
        }

        .player-wrapper #player {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .player-info {
            position: absolute;
            bottom: 80px;
            left: 28px;
            z-index: 20;
            color: #fff;
            text-shadow: 0 4px 30px rgba(0, 0, 0, 0.9);
            pointer-events: none;
            max-width: 80%;
        }

        .player-info h2 {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .player-info .meta {
            font-size: 14px;
            opacity: 0.85;
            display: flex;
            gap: 16px;
            align-items: center;
            flex-wrap: wrap;
        }

        .player-info .meta .badge {
            background: rgba(255, 30, 30, 0.85);
            padding: 3px 12px;
            border-radius: 30px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            backdrop-filter: blur(4px);
        }

        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 16px;
            z-index: 15;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
            text-align: center;
            width: 90%;
            max-width: 400px;
        }

        .spinner {
            width: 52px;
            height: 52px;
            border: 4px solid rgba(255, 255, 255, 0.08);
            border-top-color: #ff1a1a;
            border-radius: 50%;
            animation: spin 0.9s cubic-bezier(0.6, 0.2, 0.4, 0.8) infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error-message {
            color: #ff5a5a;
            font-size: 17px;
            padding: 24px 20px;
            background: rgba(255, 0, 0, 0.08);
            border-radius: 16px;
            border: 1px solid rgba(255, 70, 70, 0.25);
        }

        .plyr__controls {
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.88)) !important;
            padding: 24px 20px 18px !important;
            border-radius: 0 0 20px 20px;
        }

        .plyr__control--overlaid {
            background: rgba(220, 20, 20, 0.9) !important;
            border-radius: 50% !important;
            transform: scale(1.2);
        }

        @media (max-width: 768px) {
            .player-info { bottom: 70px; left: 18px; }
            .player-info h2 { font-size: 20px; }
        }
    </style>
</head>
<body>
    <div class="player-container">
        <div class="player-wrapper">
            <div id="loading" class="loading">
                <div class="spinner"></div>
                <span>Loading movie …</span>
            </div>
            <div id="player"></div>
            <div id="playerInfo" class="player-info" style="display: none;">
                <h2 id="movieTitle"></h2>
                <div class="meta">
                    <span id="movieYear"></span>
                    <span class="badge" id="movieQuality"></span>
                </div>
            </div>
        </div>
    </div>

    <!-- Plyr JS -->
    <script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>
    <script>
        (function() {
            "use strict";

            // ================================================================
            //  MOVIE DATABASE
            // ================================================================
            const VIDEOS_JSON = {
                "videos": {
                    "tt0111161": {
                        "youtube_id": "6hB3S9bIaco",
                        "title": "The Shawshank Redemption",
                        "year": "1994",
                        "quality": "4K HDR"
                    },
                    "tt0068646": {
                        "youtube_id": "sY1S34973zA",
                        "title": "The Godfather",
                        "year": "1972",
                        "quality": "4K"
                    },
                    "tt0468569": {
                        "youtube_id": "EXeTwQWrcwY",
                        "title": "The Dark Knight",
                        "year": "2008",
                        "quality": "4K IMAX"
                    },
                    "350787": {
                        "youtube_id": "8B1rJhN-p2Y",
                        "title": "Pandippada",
                        "year": "2005",
                        "quality": "HD"
                    }
                }
            };

            // DOM refs
            const loadingEl = document.getElementById('loading');
            const playerInfo = document.getElementById('playerInfo');
            const movieTitle = document.getElementById('movieTitle');
            const movieYear = document.getElementById('movieYear');
            const movieQuality = document.getElementById('movieQuality');
            const playerContainer = document.getElementById('player');

            let playerInstance = null;

            // ================================================================
            //  GET MOVIE ID FROM URL
            // ================================================================
            function getMovieId() {
                // Check query parameter: ?id=tt0111161
                const params = new URLSearchParams(window.location.search);
                const idParam = params.get('id');
                if (idParam) return idParam;

                // Check path: /movie/tt0111161
                const path = window.location.pathname;
                const parts = path.split('/').filter(p => p.length > 0);
                const lastPart = parts[parts.length - 1] || '';
                
                // Check if it's a movie ID (starts with 'tt' or is numeric)
                if (lastPart.match(/^(tt\d+|\d+)$/)) {
                    return lastPart;
                }

                // Check if path is like /movie/350787
                if (parts.length >= 2 && parts[parts.length - 2] === 'movie') {
                    const id = parts[parts.length - 1];
                    if (id.match(/^(tt\d+|\d+)$/)) {
                        return id;
                    }
                }

                // Default fallback
                return 'tt0111161';
            }

            const movieId = getMovieId();
            console.log('🎬 Movie ID:', movieId);

            // ================================================================
            //  GET VIDEO DATA
            // ================================================================
            function getVideo(id) {
                return VIDEOS_JSON.videos[id] || null;
            }

            // ================================================================
            //  INIT PLAYER - FIXED VERSION
            // ================================================================
            function initPlayer() {
                try {
                    const video = getVideo(movieId);
                    
                    if (!video) {
                        loadingEl.innerHTML = `
                            <div class="error-message">
                                <span class="error-icon">🎬</span>
                                <strong>Movie not found</strong>
                                <p style="margin-top: 8px; font-size: 14px; opacity: 0.7;">
                                    No video for ID: ${movieId}
                                </p>
                            </div>
                        `;
                        loadingEl.style.display = 'flex';
                        return;
                    }

                    // Show movie info
                    movieTitle.textContent = video.title;
                    movieYear.textContent = video.year;
                    movieQuality.textContent = video.quality;
                    playerInfo.style.display = 'block';

                    // Hide loading
                    loadingEl.style.display = 'none';

                    // Create YouTube player container
                    playerContainer.innerHTML = `
                        <div id="youtube-player"></div>
                    `;

                    const youtubeDiv = document.getElementById('youtube-player');
                    if (!youtubeDiv) {
                        throw new Error('Player container not found');
                    }

                    // Initialize Plyr with YouTube
                    playerInstance = new Plyr(youtubeDiv, {
                        type: 'youtube',
                        youtube: {
                            id: video.youtube_id,
                            autoplay: 1,
                            rel: 0,
                            modestbranding: 1,
                            showinfo: 0,
                            iv_load_policy: 3,
                            playsinline: 1,
                            enablejsapi: 1
                        },
                        controls: [
                            'play-large', 'play', 'progress', 'current-time',
                            'duration', 'mute', 'volume', 'captions',
                            'settings', 'pip', 'airplay', 'fullscreen'
                        ],
                        settings: ['quality', 'speed'],
                        quality: {
                            default: 'hd720',
                            options: ['hd1080', 'hd720', 'auto']
                        },
                        speed: {
                            selected: 1,
                            options: [0.5, 0.75, 1, 1.25, 1.5, 2]
                        }
                    });

                    // Event handlers
                    playerInstance.on('ready', () => {
                        console.log('✅ Player ready:', video.title);
                        // Try to autoplay
                        try {
                            playerInstance.play();
                        } catch (e) {
                            console.log('Autoplay blocked, user must click play');
                        }
                    });

                    playerInstance.on('error', (error) => {
                        console.error('❌ Player error:', error);
                        loadingEl.innerHTML = `
                            <div class="error-message">
                                <span class="error-icon">⚠️</span>
                                <strong>Playback Error</strong>
                                <p style="margin-top: 8px; font-size: 14px; opacity: 0.7;">
                                    Could not load the video. Please try again.
                                </p>
                            </div>
                        `;
                        loadingEl.style.display = 'flex';
                        playerInfo.style.display = 'none';
                    });

                } catch (error) {
                    console.error('❌ Init error:', error);
                    loadingEl.innerHTML = `
                        <div class="error-message">
                            <span class="error-icon">❌</span>
                            <strong>Error</strong>
                            <p style="margin-top: 8px; font-size: 14px; opacity: 0.7;">
                                ${error.message || 'Unknown error'}
                            </p>
                        </div>
                    `;
                    loadingEl.style.display = 'flex';
                }
            }

            // ================================================================
            //  START PLAYER
            // ================================================================
            function startPlayer() {
                if (typeof Plyr !== 'undefined') {
                    // Small delay to ensure DOM is ready
                    setTimeout(initPlayer, 200);
                } else {
                    // Wait for Plyr to load
                    const checkPlyr = setInterval(() => {
                        if (typeof Plyr !== 'undefined') {
                            clearInterval(checkPlyr);
                            setTimeout(initPlayer, 200);
                        }
                    }, 100);
                    
                    // Timeout after 5 seconds
                    setTimeout(() => {
                        clearInterval(checkPlyr);
                        if (!playerInstance) {
                            loadingEl.innerHTML = `
                                <div class="error-message">
                                    <span class="error-icon">⏳</span>
                                    <strong>Loading timeout</strong>
                                    <p style="margin-top: 8px; font-size: 14px; opacity: 0.7;">
                                        Please refresh the page.
                                    </p>
                                </div>
                            `;
                            loadingEl.style.display = 'flex';
                        }
                    }, 5000);
                }
            }

            // Start when DOM is ready
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', startPlayer);
            } else {
                startPlayer();
            }

        })();
    </script>
</body>
</html>
