<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Movie Player</title>

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
    }

    .player-container {
      width: 100%;
      max-width: 1280px;
    }

    .player-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      background: #000;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,.75);
    }

    #player {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    #player iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }

    .loading {
      position: absolute;
      inset: 0;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: #000;
      color: #fff;
      text-align: center;
      padding: 20px;
    }

    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(255,255,255,.15);
      border-top-color: #e50914;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .error-message {
      max-width: 600px;
      padding: 22px;
      border: 1px solid rgba(255,80,80,.35);
      border-radius: 14px;
      background: rgba(255,0,0,.08);
      line-height: 1.5;
    }

    .error-message strong {
      display: block;
      font-size: 18px;
      margin-bottom: 8px;
    }

    .error-message small {
      display: block;
      margin-top: 10px;
      opacity: .7;
      word-break: break-word;
    }

    .player-info {
      position: absolute;
      z-index: 10;
      left: 22px;
      right: 22px;
      bottom: 72px;
      pointer-events: none;
      text-shadow: 0 2px 14px #000;
    }

    .player-info h1 {
      margin: 0 0 6px;
      font-size: 25px;
      font-weight: 700;
    }

    .meta {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      font-size: 14px;
    }

    .badge {
      display: inline-block;
      padding: 4px 9px;
      border-radius: 999px;
      background: #e50914;
      font-size: 11px;
      font-weight: 700;
    }

    @media (max-width: 600px) {
      body { padding: 0; }

      .player-wrapper {
        border-radius: 0;
        min-height: 56.25vw;
      }

      .player-info {
        left: 14px;
        right: 14px;
        bottom: 62px;
      }

      .player-info h1 { font-size: 18px; }
      .meta { font-size: 12px; }
    }
  </style>
</head>

<body>
  <main class="player-container">
    <section class="player-wrapper" id="playerWrapper">

      <div class="loading" id="loading">
        <div class="spinner"></div>
        <div id="loadingText">Loading movie...</div>
      </div>

      <div id="player"></div>

      <div class="player-info" id="playerInfo" hidden>
        <h1 id="movieTitle"></h1>
        <div class="meta">
          <span id="movieYear"></span>
          <span class="badge" id="movieQuality"></span>
        </div>
      </div>

    </section>
  </main>

  <!-- YouTube IFrame API -->
  <script src="https://www.youtube.com/iframe_api"></script>

  <script>
    "use strict";

    /*
      MOVIE DATABASE

      Supported URLs:
        /embed/movie/tt0111161
        /embed/movie/350787
        /movie/tt0111161
        /?id=tt0111161
        /?tmdb=350787
        /?movie=350787
    */

    const MOVIES = {
      "tt0111161": {
        youtube_id: "6hB3S9bIaco",
        title: "The Shawshank Redemption",
        year: "1994",
        quality: "4K HDR"
      },

      "tt0068646": {
        youtube_id: "sY1S34973zA",
        title: "The Godfather",
        year: "1972",
        quality: "4K"
      },

      "351421": {
        youtube_id: "s6P9QNj2_o0",
        title: "The Dark Knight",
        year: "2008",
        quality: "4K IMAX"
      },

      "350787": {
        youtube_id: "3IqGqL-FyQk",
        title: "Pandippada",
        year: "2005",
        quality: "HD"
      }
    };

    const loadingEl = document.getElementById("loading");
    const playerEl = document.getElementById("player");
    const playerInfoEl = document.getElementById("playerInfo");
    const movieTitleEl = document.getElementById("movieTitle");
    const movieYearEl = document.getElementById("movieYear");
    const movieQualityEl = document.getElementById("movieQuality");

    let youtubePlayer = null;
    let apiReady = false;
    let initialized = false;

    function cleanId(value) {
      if (!value) return "";

      try {
        return decodeURIComponent(String(value))
          .trim()
          .replace(/^\/+|\/+$/g, "");
      } catch (error) {
        return String(value)
          .trim()
          .replace(/^\/+|\/+$/g, "");
      }
    }

    function getMovieId() {
      const url = new URL(window.location.href);

      const queryId =
        url.searchParams.get("id") ||
        url.searchParams.get("tmdb") ||
        url.searchParams.get("movie");

      if (queryId) {
        return cleanId(queryId);
      }

      const parts = url.pathname
        .split("/")
        .map(cleanId)
        .filter(Boolean);

      if (!parts.length) return "";

      const movieIndex = parts.findIndex(
        part => part.toLowerCase() === "movie"
      );

      if (movieIndex !== -1 && parts[movieIndex + 1]) {
        return parts[movieIndex + 1];
      }

      return parts[parts.length - 1];
    }

    function isValidYouTubeId(id) {
      return (
        typeof id === "string" &&
        /^[A-Za-z0-9_-]{11}$/.test(id)
      );
    }

    function showError(title, message) {
      loadingEl.innerHTML = `
        <div class="error-message">
          <strong>${escapeHtml(title)}</strong>
          <div>${escapeHtml(message)}</div>
          <small>
            Movie ID: ${escapeHtml(getMovieId() || "not specified")}
          </small>
        </div>
      `;

      loadingEl.hidden = false;
      playerInfoEl.hidden = true;
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function showMovieInfo(movie) {
      movieTitleEl.textContent = movie.title || "";
      movieYearEl.textContent = movie.year || "";
      movieQualityEl.textContent = movie.quality || "HD";
      playerInfoEl.hidden = false;
    }

    function getPlayerErrorMessage(code) {
      switch (code) {
        case 2:
          return "Invalid YouTube video ID.";
        case 5:
          return "The YouTube HTML5 player could not play this video.";
        case 100:
          return "This YouTube video does not exist or has been removed.";
        case 101:
        case 150:
          return "This video does not allow playback in an embedded player.";
        default:
          return "YouTube could not load this video.";
      }
    }

    function createYouTubePlayer(movie) {
      if (initialized) return;

      if (!window.YT || !window.YT.Player) {
        showError(
          "YouTube API not ready",
          "The YouTube IFrame API has not finished loading."
        );
        return;
      }

      initialized = true;

      playerEl.innerHTML = "";

      youtubePlayer = new YT.Player("player", {
        width: "100%",
        height: "100%",
        videoId: movie.youtube_id,

        playerVars: {
          autoplay: 0,
          controls: 1,
          rel: 0,
          playsinline: 1,
          modestbranding: 1,
          iv_load_policy: 3
        },

        events: {

          onReady: function(event) {
            console.log("YouTube player ready:", movie.title);
            loadingEl.hidden = true;

            /*
              Autoplay is intentionally disabled because
              mobile browsers may block autoplay.
              The user can press the YouTube Play button.
            */
          },

          onStateChange: function(event) {
            console.log("YouTube state:", event.data);

            if (event.data === YT.PlayerState.PLAYING) {
              loadingEl.hidden = true;
            }
          },

          onError: function(event) {
            console.error("YouTube error:", event.data);

            initialized = false;

            showError(
              "Playback error",
              getPlayerErrorMessage(event.data)
            );
          }

        }
      });
    }

    function initMovie() {
      const movieId = getMovieId();

      console.log("Movie ID:", movieId);

      if (!movieId) {
        showError(
          "Movie ID missing",
          "Open this page with ?id=350787 or /movie/350787."
        );
        return;
      }

      const movie = MOVIES[movieId];

      if (!movie) {
        showError(
          "Movie not found",
          "No movie is configured for this movie ID."
        );
        return;
      }

      if (!isValidYouTubeId(movie.youtube_id)) {
        showError(
          "Invalid YouTube ID",
          "The configured YouTube video ID must contain exactly 11 characters."
        );
        return;
      }

      showMovieInfo(movie);

      if (apiReady) {
        createYouTubePlayer(movie);
      } else {
        loadingEl.hidden = false;
        document.getElementById("loadingText").textContent =
          "Loading YouTube player...";
      }
    }

    /*
      YouTube automatically calls this function after
      https://www.youtube.com/iframe_api has loaded.
    */
    window.onYouTubeIframeAPIReady = function() {
      console.log("YouTube IFrame API loaded");

      apiReady = true;

      initMovie();
    };

    /*
      Start after DOM is ready.
    */
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", function() {
        /*
          If API has already loaded, initialize immediately.
          Otherwise onYouTubeIframeAPIReady() will initialize it.
        */
        if (window.YT && window.YT.Player) {
          apiReady = true;
          initMovie();
        }
      });
    } else {
      if (window.YT && window.YT.Player) {
        apiReady = true;
        initMovie();
      }
    }
  </script>
</body>
</html>
