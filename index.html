<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Movie Player</title>

  <link
    rel="stylesheet"
    href="https://cdn.plyr.io/3.7.8/plyr.css"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .player-container {
      width: 100%;
      max-width: 1280px;
    }

    .player-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      background: #000;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.75);
    }

    #player {
      width: 100%;
      height: 100%;
    }

    #player .plyr,
    #player .plyr__video-embed,
    #player iframe {
      width: 100%;
      height: 100%;
    }

    iframe {
      border: 0;
    }

    .loading {
      position: absolute;
      inset: 0;
      z-index: 20;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      gap: 16px;
      padding: 20px;

      background: #000;
      color: #fff;
      text-align: center;
    }

    .spinner {
      width: 48px;
      height: 48px;

      border: 4px solid rgba(255, 255, 255, 0.15);
      border-top-color: #e50914;
      border-radius: 50%;

      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .error-message {
      width: 100%;
      max-width: 600px;

      padding: 22px;

      border: 1px solid rgba(255, 80, 80, 0.35);
      border-radius: 14px;

      background: rgba(255, 0, 0, 0.08);

      line-height: 1.5;
    }

    .error-message strong {
      display: block;
      margin-bottom: 8px;
      font-size: 18px;
    }

    .error-message small {
      display: block;
      margin-top: 10px;
      opacity: 0.7;
      word-break: break-word;
    }

    .player-info {
      position: absolute;
      z-index: 10;

      left: 22px;
      right: 22px;
      bottom: 72px;

      pointer-events: none;

      text-shadow: 0 2px 14px #000;
    }

    .player-info h1 {
      margin: 0 0 6px;
      font-size: 25px;
      font-weight: 700;
    }

    .meta {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      font-size: 14px;
    }

    .badge {
      display: inline-block;

      padding: 4px 9px;
      border-radius: 999px;

      background: #e50914;

      font-size: 11px;
      font-weight: 700;
    }

    @media (max-width: 600px) {
      body {
        padding: 0;
      }

      .player-wrapper {
        border-radius: 0;
        min-height: 56.25vw;
      }

      .player-info {
        left: 14px;
        right: 14px;
        bottom: 62px;
      }

      .player-info h1 {
        font-size: 18px;
      }

      .meta {
        font-size: 12px;
      }
    }
  </style>
</head>

<body>

  <main class="player-container">

    <section class="player-wrapper">

      <div class="loading" id="loading">
        <div class="spinner"></div>
        <div id="loadingText">Loading movie...</div>
      </div>

      <div id="player"></div>

      <div class="player-info" id="playerInfo" hidden>
        <h1 id="movieTitle"></h1>

        <div class="meta">
          <span id="movieYear"></span>
          <span class="badge" id="movieQuality"></span>
        </div>
      </div>

    </section>

  </main>

  <!-- Plyr -->
  <script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>

  <script>
    "use strict";

    /*
     * MOVIE DATABASE
     *
     * Supported:
     *
     * ?id=tt0111161
     * ?tmdb=350787
     * ?movie=350787
     *
     * /movie/350787
     * /embed/movie/350787
     */

    const MOVIES = {

      "tt0111161": {
        youtube_id: "6hB3S9bIaco",
        title: "The Shawshank Redemption",
        year: "1994",
        quality: "4K HDR"
      },

      "tt0068646": {
        youtube_id: "sY1S34973zA",
        title: "The Godfather",
        year: "1972",
        quality: "4K"
      },

      "351421": {
        youtube_id: "s6P9QNj2_o0",
        title: "The Dark Knight",
        year: "2008",
        quality: "4K IMAX"
      },

      "350787": {
        youtube_id: "3IqGqL-FyQk",
        title: "Pandippada",
        year: "2005",
        quality: "HD"
      }

    };


    const loadingEl = document.getElementById("loading");
    const loadingTextEl = document.getElementById("loadingText");

    const playerEl = document.getElementById("player");

    const playerInfoEl = document.getElementById("playerInfo");
    const movieTitleEl = document.getElementById("movieTitle");
    const movieYearEl = document.getElementById("movieYear");
    const movieQualityEl = document.getElementById("movieQuality");

    let plyrInstance = null;


    /*
     * Escape HTML
     */
    function escapeHtml(value) {

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    /*
     * Clean URL value
     */
    function cleanId(value) {

      if (!value) {
        return "";
      }

      try {
        return decodeURIComponent(String(value))
          .trim()
          .replace(/^\/+|\/+$/g, "");
      } catch (error) {
        return String(value)
          .trim()
          .replace(/^\/+|\/+$/g, "");
      }

    }


    /*
     * Get movie ID from URL
     */
    function getMovieId() {

      const url = new URL(window.location.href);

      /*
       * Query string
       *
       * ?id=350787
       * ?tmdb=350787
       * ?movie=350787
       */
      const queryId =
        url.searchParams.get("id") ||
        url.searchParams.get("tmdb") ||
        url.searchParams.get("movie");

      if (queryId) {
        return cleanId(queryId);
      }


      /*
       * Path
       *
       * /movie/350787
       * /embed/movie/350787
       */
      const parts = url.pathname
        .split("/")
        .map(cleanId)
        .filter(Boolean);

      if (!parts.length) {
        return "";
      }


      const movieIndex = parts.findIndex(function (part) {
        return part.toLowerCase() === "movie";
      });

      if (
        movieIndex !== -1 &&
        parts[movieIndex + 1]
      ) {
        return parts[movieIndex + 1];
      }


      /*
       * /embed/350787
       * /350787
       */
      return parts[parts.length - 1];

    }


    /*
     * Validate YouTube video ID
     */
    function isValidYouTubeId(id) {

      return (
        typeof id === "string" &&
        /^[A-Za-z0-9_-]{11}$/.test(id)
      );

    }


    /*
     * Show error
     */
    function showError(title, message) {

      loadingEl.innerHTML = `
        <div class="error-message">

          <strong>${escapeHtml(title)}</strong>

          <div>
            ${escapeHtml(message)}
          </div>

          <small>
            Movie ID:
            ${escapeHtml(getMovieId() || "not specified")}
          </small>

        </div>
      `;

      loadingEl.hidden = false;
      playerInfoEl.hidden = true;

    }


    /*
     * Show movie information
     */
    function showMovieInfo(movie) {

      movieTitleEl.textContent = movie.title || "";
      movieYearEl.textContent = movie.year || "";
      movieQualityEl.textContent = movie.quality || "HD";

      playerInfoEl.hidden = false;

    }


    /*
     * Destroy old Plyr instance
     */
    function destroyPlayer() {

      if (!plyrInstance) {
        return;
      }

      try {
        plyrInstance.destroy();
      } catch (error) {
        console.warn("Plyr destroy error:", error);
      }

      plyrInstance = null;

    }


    /*
     * Initialize player
     */
    function initPlayer() {

      const movieId = getMovieId();

      console.log("Movie ID:", movieId);


      /*
       * Check movie ID
       */
      if (!movieId) {

        showError(
          "Movie ID missing",
          "Use ?id=350787 or /movie/350787"
        );

        return;
      }


      /*
       * Find movie
       */
      const movie = MOVIES[movieId];

      if (!movie) {

        showError(
          "Movie not found",
          "No movie is configured for this ID."
        );

        return;
      }


      /*
       * Validate YouTube ID
       */
      if (!isValidYouTubeId(movie.youtube_id)) {

        showError(
          "Invalid YouTube ID",
          "YouTube video ID must contain exactly 11 characters."
        );

        return;
      }


      showMovieInfo(movie);


      /*
       * Remove previous player
       */
      destroyPlayer();

      playerEl.innerHTML = "";


      /*
       * Create YouTube element
       */
      const youtubePlayer = document.createElement("div");

      youtubePlayer.id = "youtube-player";

      youtubePlayer.setAttribute(
        "data-plyr-provider",
        "youtube"
      );

      youtubePlayer.setAttribute(
        "data-plyr-embed-id",
        movie.youtube_id
      );

      playerEl.appendChild(youtubePlayer);


      /*
       * Initialize Plyr
       */
      try {

        plyrInstance = new Plyr(
          youtubePlayer,
          {

            controls: [
              "play-large",
              "play",
              "progress",
              "current-time",
              "duration",
              "mute",
              "volume",
              "settings",
              "pip",
              "fullscreen"
            ],

            settings: [
              "quality",
              "speed"
            ],

            speed: {
              selected: 1,
              options: [
                0.5,
                0.75,
                1,
                1.25,
                1.5,
                2
              ]
            },

            youtube: {
              noCookie: true,
              rel: 0,
              modestbranding: 1,
              playsinline: 1
            },

            fullscreen: {
              enabled: true,
              fallback: true,
              iosNative: true
            }

          }
        );


        /*
         * Player ready
         */
        plyrInstance.on(
          "ready",
          function () {

            console.log(
              "Plyr ready:",
              movie.title
            );

            loadingEl.hidden = true;


            /*
             * Don't force autoplay.
             * Mobile browsers often block it.
             */
            console.log(
              "Player is ready. Press Play to start."
            );

          }
        );


        /*
         * Player error
         */
        plyrInstance.on(
          "error",
          function (event) {

            console.error(
              "Plyr error:",
              event
            );

            showError(
              "Playback error",
              "The YouTube video could not be played. Make sure the video exists and embedding is enabled."
            );

          }
        );

      } catch (error) {

        console.error(
          "Plyr initialization failed:",
          error
        );

        showError(
          "Player initialization failed",
          error && error.message
            ? error.message
            : "Unknown error."
        );

      }

    }


    /*
     * Start application
     */
    function start() {

      if (typeof Plyr === "undefined") {

        showError(
          "Plyr failed to load",
          "The Plyr JavaScript library could not be loaded. Check your internet connection or CDN access."
        );

        return;
      }

      initPlayer();

    }


    /*
     * DOM ready
     */
    if (
      document.readyState === "loading"
    ) {

      document.addEventListener(
        "DOMContentLoaded",
        start
      );

    } else {

      start();

    }

  </script>

</body>
</html>
