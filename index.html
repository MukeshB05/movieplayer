<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Movie Player</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin:0; width:100%; min-height:100%; background:#000; color:#fff; font-family:Arial,sans-serif; }
    body { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:16px; }
    .player-container { width:100%; max-width:1280px; }
    .player-wrapper { position:relative; width:100%; aspect-ratio:16/9; overflow:hidden; background:#000; border-radius:16px; box-shadow:0 20px 60px rgba(0,0,0,.75); }
    #player { position:absolute; inset:0; width:100%; height:100%; }
    #player iframe { width:100%; height:100%; border:0; display:block; }
    .loading { position:absolute; inset:0; z-index:20; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; background:#000; color:#fff; text-align:center; padding:20px; transition:opacity .5s ease; }
    .loading.hidden { opacity:0; pointer-events:none; }
    .spinner { width:48px; height:48px; border:4px solid rgba(255,255,255,.15); border-top-color:#e50914; border-radius:50%; animation:spin .8s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
    .error-message { max-width:600px; padding:22px; border:1px solid rgba(255,80,80,.35); border-radius:14px; background:rgba(255,0,0,.08); line-height:1.5; }
    .error-message strong { display:block; font-size:18px; margin-bottom:8px; }
    .error-message small { display:block; margin-top:10px; opacity:.7; word-break:break-word; }
    .retry-btn { margin-top:15px; padding:10px 24px; background:#e50914; color:#fff; border:none; border-radius:4px; font-size:14px; font-weight:600; cursor:pointer; transition:background .3s; }
    .retry-btn:hover { background:#f40612; }
    @media (max-width:600px) { body { padding:0; } .player-wrapper { border-radius:0; min-height:56.25vw; } }
  </style>
</head>
<body>
  <main class="player-container">
    <section class="player-wrapper">
      <div class="loading" id="loading">
        <div class="spinner"></div>
        <div id="loadingText">Loading movie...</div>
      </div>
      <div id="player"></div>
      <!-- player-info removed entirely -->
    </section>
  </main>
  <script>
    "use strict";
    const MOVIES = {
      "tt0111161": { youtube_id: "6hB3S9bIaco", title: "The Shawshank Redemption", year: "1994", quality: "4K HDR" },
      "285945": { youtube_id: "40nfhLC7i84", title: "Vettam", year: "2004", quality: "FHD" },
      "318773": { youtube_id: "s6P9QNj2_o0", title: "Pachakuthira", year: "2006", quality: "2K" },
      "351409": { youtube_id: "h-elwYVvT8o", title: "Aakasha Ganga", year: "1999", quality: "2K" },
      "351421": { youtube_id: "s6P9QNj2_o0", title: "Kuberan", year: "2002", quality: "2K" },
      "350787": { youtube_id: "3IqGqL-FyQk", title: "Pandippada", year: "2005", quality: "HD" }
    };
    const loadingEl = document.getElementById("loading");
    const loadingTextEl = document.getElementById("loadingText");
    const playerEl = document.getElementById("player");

    function cleanId(v) { if (!v) return ""; try { return decodeURIComponent(String(v)).trim().replace(/^\/+|\/+$/g,""); } catch(e) { return String(v).trim().replace(/^\/+|\/+$/g,""); } }
    function getMovieId() {
      const url = new URL(window.location.href);
      const q = url.searchParams.get("id") || url.searchParams.get("tmdb") || url.searchParams.get("movie");
      if (q) return cleanId(q);
      const parts = url.pathname.split("/").map(cleanId).filter(Boolean);
      if (!parts.length) return "";
      const idx = parts.findIndex(p => p.toLowerCase() === "movie");
      return idx !== -1 && parts[idx+1] ? parts[idx+1] : parts[parts.length-1];
    }
    function isValidYouTubeId(id) { return typeof id === "string" && /^[A-Za-z0-9_-]{11}$/.test(id); }
    function escapeHtml(v) { return String(v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;"); }
    function showError(title, message, showRetry=true) {
      loadingEl.innerHTML = `<div class="error-message"><strong>${escapeHtml(title)}</strong><div>${escapeHtml(message)}</div><small>Movie ID: ${escapeHtml(getMovieId()||"not specified")}</small>${showRetry ? `<button class="retry-btn" onclick="location.reload()">Retry</button>` : ''}</div>`;
      loadingEl.classList.remove("hidden");
    }
    function hideLoading() { loadingEl.classList.add("hidden"); setTimeout(()=>{ loadingEl.style.display="none"; },500); }

    function initMovie() {
      const movieId = getMovieId();
      if (!movieId) { showError("Movie ID missing","Open this page with ?id=350787 or /movie/350787.",false); return; }
      const movie = MOVIES[movieId];
      if (!movie) { showError("Movie not found",`No movie configured for ID: ${movieId}`,false); return; }
      if (!isValidYouTubeId(movie.youtube_id)) { showError("Invalid YouTube ID","The configured YouTube video ID must contain exactly 11 characters.",false); return; }

      const iframe = document.createElement('iframe');
      iframe.src = `https://www.youtube.com/embed/${movie.youtube_id}?autoplay=1&controls=1&rel=0&playsinline=1&modestbranding=1`;
      iframe.allow = "autoplay; encrypted-media; fullscreen";
      iframe.allowFullscreen = true;
      iframe.setAttribute('loading','lazy');
      iframe.onload = function() { hideLoading(); loadingTextEl.textContent = "Movie loaded"; };
      iframe.onerror = function() { showError("Failed to load video","The YouTube video could not be loaded. Please try again.",true); };
      playerEl.innerHTML = '';
      playerEl.appendChild(iframe);
      // fallback hide after 3s
      setTimeout(() => { if (!loadingEl.classList.contains("hidden")) { hideLoading(); loadingTextEl.textContent = "Video ready"; } }, 3000);
    }
    document.addEventListener("DOMContentLoaded", initMovie);
  </script>
</body>
</html>
